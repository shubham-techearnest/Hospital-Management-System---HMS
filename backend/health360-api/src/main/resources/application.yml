spring:
  application:
    name: health360-api
  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:health360_db}
    username: ${POSTGRES_USER:health360}
    password: ${POSTGRES_PASSWORD:health360_local_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  data:
    redis:
      timeout: 2000ms

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"

health360:
  default-tenant-slug: ${DEFAULT_TENANT_SLUG:default}
  default-tenant-id: 00000000-0000-0000-0000-000000000001
  app-base-url: ${APP_BASE_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  push:
    enabled: ${PUSH_ENABLED:true}
  sms:
    enabled: ${SMS_ENABLED:true}
    provider: ${SMS_PROVIDER:log}
    auth-key: ${SMS_AUTH_KEY:}
    sender-id: ${SMS_SENDER_ID:H360AI}
    template-id: ${SMS_TEMPLATE_ID:}
    api-base-url: ${SMS_API_BASE_URL:https://control.msg91.com/api/v5}
    send-http-url: ${SMS_SEND_HTTP_URL:https://api.msg91.com/api/sendhttp.php}
  payments:
    razorpay:
      mode: ${RAZORPAY_MODE:sandbox}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}

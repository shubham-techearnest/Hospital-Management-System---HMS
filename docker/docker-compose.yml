services:
  postgres:
    image: postgres:16-alpine
    container_name: health360-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-health360_db}
      POSTGRES_USER: ${POSTGRES_USER:-health360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health360_local_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health360} -d ${POSTGRES_DB:-health360_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: health360-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend/health360-api
      dockerfile: Dockerfile
    container_name: health360-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-health360_db}
      POSTGRES_USER: ${POSTGRES_USER:-health360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health360_local_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-default}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../frontend/health360-web
      dockerfile: Dockerfile
    container_name: health360-web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

  nginx:
    image: nginx:1.25-alpine
    container_name: health360-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:

# External keep-alive for hosted API (Render free tier sleeps after ~15 min idle).
# GitHub cron can be delayed; 5-minute schedule stays under that window.
# Also configure UptimeRobot / cron-job.org as backup (see docs below).
#
# Required: set repository variable API_HEALTH_URL (Settings → Secrets and variables → Actions)
#   Example: https://health360-api-6hz5.onrender.com/api/v1/health/awake
#
# UptimeRobot backup:
#   URL: https://<your-api-host>/api/v1/health/awake
#   Interval: 5 minutes
name: Keep API awake

on:
  schedule:
    # Every 5 minutes (UTC). Render free tier idles ~15 min without traffic.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-api-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping wake endpoint
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          set -euo pipefail
          URL="${API_HEALTH_URL:-https://health360-api-6hz5.onrender.com/api/v1/health/awake}"
          echo "Pinging $URL"
          # Cold start on Render can take 50–90s; allow retries.
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors --max-time 120 "$URL"
          echo "Wake ping OK"

name: E2E — OPD smoke (Playwright)

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/health360-web/**'
      - '.github/workflows/e2e-opd.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/health360-web/**'

jobs:
  opd-api-smoke:
    name: API health smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping wake + health
        env:
          API_BASE: ${{ vars.API_HEALTH_URL }}
        run: |
          set -euo pipefail
          AWAKE_URL="${API_BASE:-https://health360-api-6hz5.onrender.com/api/v1/health/awake}"
          if [[ "$AWAKE_URL" != *"/health/awake" ]]; then
            AWAKE_URL="https://health360-api-6hz5.onrender.com/api/v1/health/awake"
          fi
          HEALTH_URL="${AWAKE_URL%/health/awake}/health"
          echo "Awake: $AWAKE_URL"
          curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 120 -o /dev/null -w "%{http_code}\n" "$AWAKE_URL"
          echo "Health: $HEALTH_URL"
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 "$HEALTH_URL" | head -c 400
          echo

  # Full UI golden path — run manually when local/staging stack is up
  opd-ui-smoke:
    name: UI golden path (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/health360-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/health360-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run OPD e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
          E2E_PATIENT_EMAIL: ${{ secrets.E2E_PATIENT_EMAIL }}
          E2E_PATIENT_PASSWORD: ${{ secrets.E2E_PATIENT_PASSWORD }}
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/health360-web/playwright-report/
          retention-days: 7
